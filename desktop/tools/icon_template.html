<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px; height: 512px;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-container {
    width: 480px; height: 480px;
    background: linear-gradient(155deg, #1a1c23 0%, #0c0d12 100%);
    border-radius: 118px;
    box-shadow: 0 24px 52px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.16), inset 0 -1px 1px rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  svg {
    width: 290px; height: 290px;
  }
</style>
</head>
<body>
<div class="icon-container">
  <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="60%" stop-color="#cbd5e1" />
        <stop offset="100%" stop-color="#64748b" />
      </linearGradient>
      <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#818cf8" />
        <stop offset="100%" stop-color="#6366f1" />
      </linearGradient>
    </defs>

    <!-- Outer Precision Focus Ring (Timer Dial Opening at 12 o'clock) -->
    <circle cx="120" cy="120" r="90" stroke="url(#outerGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="465 100" transform="rotate(-65 120 120)" />

    <!-- Flow Lens: Streamlined fluid inner loop -->
    <circle cx="120" cy="120" r="54" stroke="url(#innerGrad)" stroke-width="11" stroke-linecap="round" stroke-dasharray="260 80" transform="rotate(115 120 120)" />

    <!-- Center Zen Focus Point -->
    <circle cx="120" cy="120" r="16" fill="#ffffff" />
  </svg>
</div>
</body>
</html>
